# This workflow will build and release Go executables for multiple platforms.

name: Release Executables

on:
  workflow_call:
    inputs:

      go-version:
        type: string
        default: "1.25.5"

      artifact-name:
        type: string
        default: "app"

      build-paths:
        type: string
        default: "."

permissions:
  contents: write

jobs:

  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Validate version
        id: version
        run: |
          VERSION=$(grep -Po '^\s{2}version:\s*\K.*' go.package.yml | tr -d "'\"")
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[a-z0-9\.-]+)?$ ]]; then
            echo "❌ Invalid version: $VERSION"
            echo "✅ Expected format: v1.2.3 or v1.2.3-beta.1"
            exit 1
          fi

          IS_DEV=false
          if [[ "$VERSION" =~ -dev.0$ ]]; then
            IS_DEV=true
            VERSION="${VERSION%-dev.0}-dev.$(date +%Y%m%d%H%M%S)"
            echo "⚠️ Unstamped development version detected. Updated version to: $VERSION"
          fi

          if [[ "$IS_DEV" == "true" && "${GITHUB_REF_NAME}" != "dev" ]]; then
            echo "🚫 Development versions can only be released from the 'dev' branch."
            exit 1
          fi

          if [[ "$IS_DEV" == "false" && "${GITHUB_REF_NAME}" != "main" ]]; then
            echo "🚫 Stable releases can only be created from the 'main' branch."
            exit 1
          fi

          echo "✅ Branch '${GITHUB_REF_NAME}' allowed. Continuing..."

          echo "✅ Valid version: $VERSION"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Check tag exists
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git fetch --tags

          if git rev-parse "refs/tags/$VERSION" >/dev/null 2>&1; then
            echo "🚫 Tag already exists → stopping"
            exit 1
          fi

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ inputs.go-version }}
          cache: true

      - name: Build & test
        run: go test ./...

      - name: Compile multi-platform binaries
        env:
          VERSION: ${{ steps.version.outputs.version }}
          NAME: ${{ inputs.artifact-name }}
          BUILD_PATHS: ${{ inputs.build-paths }}
        run: |
          mkdir -p dist

          LDFLAGS="-s -w -X main.version=${VERSION}"

          IFS=',' read -ra PATHS <<< "$BUILD_PATHS"

          for BUILD_PATH in "${PATHS[@]}"; do
            BUILD_PATH="$(echo "$BUILD_PATH" | xargs)"

            # ./cmd/api -> api
            BINARY_NAME="$(basename "$BUILD_PATH")"

            echo "========================================"
            echo "Building: ${BINARY_NAME}"
            echo "Path:    ${BUILD_PATH}"
            echo "========================================"

            # Linux
            GOOS=linux GOARCH=amd64 CGO_ENABLED=0 \
              go build \
              -ldflags "$LDFLAGS" \
              -o "dist/${NAME}-${BINARY_NAME}-${VERSION}-linux-amd64" \
              "$BUILD_PATH"

            # Windows
            GOOS=windows GOARCH=amd64 CGO_ENABLED=0 \
              go build \
              -ldflags "$LDFLAGS" \
              -o "dist/${NAME}-${BINARY_NAME}-${VERSION}-windows-amd64.exe" \
              "$BUILD_PATH"

            # macOS ARM
            GOOS=darwin GOARCH=arm64 CGO_ENABLED=0 \
              go build \
              -ldflags "$LDFLAGS" \
              -o "dist/${NAME}-${BINARY_NAME}-${VERSION}-darwin-arm64" \
              "$BUILD_PATH"

            # macOS Intel
            GOOS=darwin GOARCH=amd64 CGO_ENABLED=0 \
              go build \
              -ldflags "$LDFLAGS" \
              -o "dist/${NAME}-${BINARY_NAME}-${VERSION}-darwin-amd64" \
              "$BUILD_PATH"
          done

          cd dist
          sha256sum * > checksums.txt

      - name: Push tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git tag "$VERSION"
          git push origin "$VERSION"

      - name: Create release with executables
        env:
          VERSION: ${{ steps.version.outputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$VERSION" dist/* \
            --title "Release $VERSION" \
            --notes "Automated build release"
          